<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تاریخچه‌خوانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0f5fa6; --primary-dark: #0a4276; --primary-light: #e8f1fa;
    --bg: #f2f6fa; --card: #ffffff; --border: #dbe4ec;
    --text: #1f2937; --text-muted: #6b7280;
    --damage: #b91c1c; --damage-bg: #fef2f2;
    --endorse: #92400e; --endorse-bg: #fffbeb;
    --ok: #15803d; --ok-bg: #ecfdf5;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Vazirmatn', Tahoma, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); font-size: 14px; }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; color: var(--primary-dark); text-align: center; }
  .sub { color: var(--text-muted); margin: 0 0 18px; font-size: .85rem; text-align: center; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15,95,166,.06); }
  .panel h2 { font-size: .95rem; margin: 0 0 12px; color: var(--primary-dark); }
  .fields { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 130px; }
  .field.sm { flex: 0 1 120px; min-width: 90px; }
  label { font-size: .8rem; color: var(--text-muted); }
  select, input { padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: .9rem; font-family: inherit; background: #fff; width: 100%; direction: ltr; text-align: center; }
  select:focus, input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .search-panel .field label { text-align: center; }
  .plate-block { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .plate-block > label { font-weight: 700; color: var(--text); }
  /* ترتیب چپ‌به‌راست مثل خود پلاک: دو رقم - حرف - سه رقم - سریال؛ ترتیب Tab و پرش خودکار هم همین است */
  .plate-row { display: flex; gap: 8px; direction: ltr; }
  .plate-row input, .plate-row select { width: 68px; padding: 7px 4px; font-size: .9rem; }
  .plate-row input#r3 { width: 76px; }
  .plate-row select { width: 64px; appearance: none; -webkit-appearance: none; cursor: pointer; font-weight: 700; color: var(--text);
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236b7280'/></svg>") no-repeat 7px center;
    padding: 7px 6px 7px 20px; text-align-last: center; }
  .plate-row select option { color: var(--text); background: #fff; font-weight: 400; }
  button { background: var(--primary); color: #fff; border: none; padding: 10px 22px; border-radius: 7px; font-size: .9rem; cursor: pointer; font-family: inherit; font-weight: 600; }
  button:hover { background: var(--primary-dark); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .go { display: block; width: auto; margin: 14px auto 0; padding: 4px 14px; font-size: .85rem; font-weight: 600; border-radius: 6px; }
  .details-bar { margin: 0 0 16px; }
  .details-toggle { background: var(--primary-light); color: var(--primary-dark); border: 1px solid var(--primary); padding: 6px 16px; font-size: .85rem; }
  .details-toggle:hover { background: #d5e6f6; }
  .details-toggle .arrow { display: inline-block; margin-inline-start: 6px; transition: transform .2s; }
  .details-toggle[aria-expanded="true"] .arrow { transform: rotate(180deg); }
  .details-body { display: none; }
  .details-body.open { display: block; }
  .status { margin: 8px 2px; font-size: .85rem; color: var(--text-muted); }
  .status.error { color: var(--damage); background: var(--damage-bg); border-radius: 8px; padding: 10px 12px; }
  .status.loading { color: var(--primary); }

  .summary { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .big { font-size: 2.6rem; font-weight: 700; line-height: 1.1; color: var(--primary-dark); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .78rem; background: var(--ok-bg); color: var(--ok); }
  .badge.review { background: var(--endorse-bg); color: var(--endorse); }
  .kv { margin: 3px 0; color: var(--text-muted); font-size: .85rem; }
  .kv b { color: var(--text); direction: ltr; unicode-bidi: plaintext; }

  .announce-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 12px; }
  @media (max-width: 640px) { .announce-grid { grid-template-columns: 1fr; } }
  .discount-box { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #fafcfe; }
  .discount-box h3 { margin: 0 0 8px; font-size: .85rem; color: var(--primary-dark); }
  .discount-box .fields { flex-wrap: nowrap; }
  .hint { font-size: .72rem; color: var(--endorse); margin-top: 6px; }
  .logic { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: #fff; }
  .logic h3 { margin: 0 0 6px; font-size: .85rem; color: var(--primary-dark); }
  .logic ol { margin: 0; padding-inline-start: 20px; font-size: .85rem; line-height: 1.95; }
  .logic li.endorse { color: var(--endorse); font-weight: 600; }
  .announce-text { background: var(--primary-light); border: 1px dashed var(--primary); border-radius: 8px; padding: 12px 14px; line-height: 2; font-weight: 600; color: var(--primary-dark); display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .announce-text span { flex: 1; }
  .announce-text button { padding: 6px 14px; font-size: .8rem; white-space: nowrap; }
  .announce-text button.copied { background: var(--ok); }

  .warn { background: var(--endorse-bg); color: var(--endorse); border-radius: 8px; padding: 8px 12px; margin: 6px 0; font-size: .85rem; }

  .table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; background: var(--card); }
  table.policy-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.policy-table thead th { background: var(--primary); color: #fff; font-weight: 600; padding: 9px 8px; text-align: right; white-space: nowrap; }
  table.policy-table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: right; background: #fff; }
  tr.policy-row:nth-child(even) td { background: #fafcfe; }
  tr.policy-row:hover td { background: var(--primary-light); }
  .num { direction: ltr; unicode-bidi: plaintext; text-align: right; }
  .strong { font-weight: 700; color: var(--primary-dark); }
  tr.sub-row td { padding: 6px 10px; font-size: .75rem; }
  tr.damage-row td { background: var(--damage-bg); color: var(--damage); }
  tr.endorsement-row td { background: var(--endorse-bg); color: var(--endorse); }
  .sub-label { font-weight: 700; margin-left: 4px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .72rem; background: var(--primary-light); color: var(--primary-dark); }
  .chip.exp { background: #f3f4f6; color: var(--text-muted); }

  .car { border-top: 1px solid var(--border); padding: 10px 0; }
  .car:first-of-type { border-top: 0; }
  .car.best { background: var(--ok-bg); margin: 0 -16px; padding: 10px 16px; }
  .car small { display: block; color: var(--text-muted); }
  .car b.ltr { direction: ltr; unicode-bidi: plaintext; }

  .print-title { display: none; }
  @media print {
    body { background: #fff; padding: 0; font-size: 11px; }
    .search-panel, #status, button, .hint, .details-bar { display: none !important; }
    .details-body { display: block !important; }
    .container { max-width: 100%; }
    h1, .sub { display: none; }
    .print-title { display: block; font-size: 1rem; margin: 0 0 10px; text-align: center; }
    .panel { box-shadow: none; }
    .announce-text, tr.damage-row td, tr.endorsement-row td, table.policy-table thead th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr.policy-row, tr.sub-row { break-inside: avoid; }
    @page { size: A4 landscape; margin: 10mm; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>تاریخچه‌خوانی</h1>
  <p class="sub">محاسبه‌ی خودکار تخفیف قابل انتقال به مالک پلاک</p>

  <div id="server"></div>

  <div class="panel search-panel">
    <div class="fields">
      <div class="field"><label for="nc">کد ملی</label><input id="nc" inputmode="numeric" maxlength="10" autocomplete="off"></div>
      <div class="field"><label for="tc">کد رهگیری</label><input id="tc" inputmode="numeric" autocomplete="off"></div>
    </div>
    <div class="plate-block">
      <label>پلاک ملی</label>
      <div class="plate-row">
        <input id="l2" inputmode="numeric" maxlength="2" placeholder="12" title="دو رقم سمت چپ" aria-label="دو رقم سمت چپ" autocomplete="off">
        <select id="lt" title="حرف پلاک" aria-label="حرف پلاک"></select>
        <input id="r3" inputmode="numeric" maxlength="3" placeholder="345" title="سه رقم سمت راست" aria-label="سه رقم سمت راست" autocomplete="off">
        <input id="sr" inputmode="numeric" maxlength="2" placeholder="67" title="سریال (ایران)" aria-label="سریال (ایران)" autocomplete="off">
      </div>
    </div>
    <button id="go" class="go">استعلام و محاسبه</button>
  </div>

  <div id="status"></div>
  <div class="print-title" id="printTitle"></div>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// اگر صفحه از خود سرور پایتون باز شده باشد آدرس نسبی است؛ اگر از GitHub Pages باز شده باشد به سرور روی همین لپ‌تاپ وصل می‌شود.
// پورت را اینجا عوض کن اگر برنامه را با --port دیگری اجرا می‌کنی.
const LOCAL_PORT = 8000;
const IS_LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
const API_BASE = IS_LOCAL ? "" : `http://127.0.0.1:${LOCAL_PORT}`;

// بررسی اینکه سرور پایتون در حال اجراست
async function checkServer() {
  const box = $("server");
  try {
    const r = await fetch(API_BASE + "/api/ping", {cache: "no-store"});
    if (!r.ok) throw new Error();
    box.replaceChildren();
  } catch (e) {
    box.replaceChildren(el("div", "status error",
      "سرور محلی در دسترس نیست. برنامه را روی همین لپ‌تاپ با دستور python app.py اجرا کن، بعد صفحه را رفرش کن. " +
      "(اگر مرورگر اجازه‌ی «دسترسی به دستگاه‌های شبکه‌ی محلی» را پرسید، Allow بزن.)"));
  }
}
window.addEventListener("focus", checkServer);
"ب الف پ ت ث ج د ر ز ژ س ش ص ط ع ف ق ک گ ل م ن و ه ی ح D S".split(" ")
  .forEach(l => $("lt").add(new Option(l, l)));
$("lt").value = "ب";

// ترتیب پر کردن پلاک: دو رقم ← حرف ← سه رقم ← سریال؛ با پر شدن هر فیلد خودکار به بعدی می‌رود
const PLATE = ["l2", "lt", "r3", "sr"].map($);
PLATE.forEach((f, i) => {
  const next = PLATE[i + 1], prev = PLATE[i - 1];
  if (f.tagName === "SELECT") {
    f.addEventListener("change", () => next && next.focus());
  } else {
    f.addEventListener("input", () => {
      // ارقام فارسی/عربی هم پذیرفته می‌شود (سرور نرمال می‌کند)؛ غیر رقم حذف می‌شود
      f.value = f.value.replace(/[^0-9\u06F0-\u06F9\u0660-\u0669]/g, "");
      if (f.value.length >= f.maxLength) { next ? next.focus() : $("go").focus(); }
    });
    f.addEventListener("keydown", e => { if (e.key === "Backspace" && !f.value && prev) { e.preventDefault(); prev.focus(); } });
  }
  f.addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const fmtDate = d => (d ? String(d).replace(/-/g, "/") : "-");
const val = v => (v === null || v === undefined || v === "" ? "-" : String(v));
const RULES = {rule1: "قانون اول (کل تخفیف بیمه‌نامه)", rule2: "قانون دوم (۵٪ برای هر سال)", rule2_transfer: "قانون دوم + تبصره انتقال قبلی تخفیف (کل تخفیف آخرین بیمه‌نامه)", rule_chain: "انتقال تخفیف از خودروی قبلیِ همین پلاک (کل تخفیف آخرین بیمه‌نامه)", none: "بدون تخفیف قابل انتقال"};

// ---------- متن اعلام تخفیف ----------
function buildAnnouncement(r) {
  const drvPct = r.driver_percent ?? r.percent, drvYears = r.driver_years ?? r.years;
  if (!(r.percent > 0) && !(drvPct > 0)) return "تخفیف قابل انتقال ندارد";
  const part = (y, p, title) => (y !== null && y !== undefined ? `${y} سال ` : "") + `${p || 0} درصد ${title}`;
  return `${part(r.years, r.percent, "تخفیف ثالث")} ${part(drvYears, drvPct, "تخفیف حوادث راننده")} ` +
         `قابل انتقال از شماره بیمه‌نامه ${r.policy_number || "-"} با شماره شاسی ${r.best_chassis || "-"}` +
         ((r.endorsement_policies || []).length
           ? ` — نیاز به الحاقیه حذف تخفیفات دارد (بیمه‌نامه ${r.endorsement_policies.join("، ")} هنوز جاری است)` : "");
}

const discountBox = (title, years, pct) => {
  const b = el("div", "discount-box"); b.append(el("h3", "", title));
  const kv = (k, v) => { const d = el("div", "kv", k + ": "); d.append(el("b", "", val(v))); return d; };
  b.append(kv("سال", years), kv("درصد", pct === null || pct === undefined ? pct : pct + "٪"));
  return b;
};

function announceCard(r, data) {
  const card = el("div", "panel");
  card.append(el("h2", "", "اعلام تخفیف"));

  const top = el("div", "summary");
  top.append(el("div", "big", (r.percent ?? 0) + "٪"));
  const meta = el("div");
  meta.append(el("span", "badge" + (data.status === "ok" ? "" : " review"),
    data.status === "ok" ? "قطعی" : "نیاز به بررسی کارشناس"));
  const kv = (k, v) => { const d = el("div", "kv", k + ": "); d.append(el("b", "", val(v))); return d; };
  meta.append(kv("شماره بیمه‌نامه‌ی مبنا", r.policy_number), kv("شماره شاسی خودروی مبنا", r.best_chassis));
  top.append(meta);
  card.append(top);

  const grid = el("div", "announce-grid"); grid.style.marginTop = "14px";
  const third = discountBox("تخفیف ثالث", r.years, r.percent);
  const missing = r.driver_percent === null || r.driver_percent === undefined;
  const drv = discountBox("تخفیف حوادث راننده", missing ? r.years : r.driver_years, missing ? r.percent : r.driver_percent);
  if (missing) drv.append(el("div", "hint", "تخفیف راننده از منبع استعلام نشد؛ مقدار ثالث اعلام می‌شود."));
  grid.append(third, drv);
  card.append(grid);

  const box = el("div", "announce-text"); const txt = el("span"); const copy = el("button", "", "کپی");
  txt.textContent = buildAnnouncement(r);
  copy.onclick = () => navigator.clipboard.writeText(txt.textContent).then(() => {
    copy.textContent = "کپی شد"; copy.classList.add("copied");
    setTimeout(() => { copy.textContent = "کپی"; copy.classList.remove("copied"); }, 1200);
  }).catch(() => {});
  box.append(txt, copy); card.append(box);

  return card;
}

// ---------- نحوه‌ی محاسبه (داخل «نمایش جزئیات») ----------
function logicPanel(r) {
  const best = r.cars.find(c => c.chassis === r.best_chassis);
  if (!best) return null;
  const wrap = el("div", "panel"); wrap.append(el("h2", "", "نحوه‌ی محاسبه"));
  const ol = el("ol"); ol.style.cssText = "margin:0;padding-inline-start:20px;font-size:.85rem;line-height:1.95";
  ol.append(el("li", "", "قاعده‌ی اعمال‌شده: " + (RULES[best.rule] || best.rule)));
  (best.notes || []).forEach(n => ol.append(el("li", "", n)));
  if ((best.counted_policies || []).length) ol.append(el("li", "", "بیمه‌نامه‌های شمرده‌شده: " + best.counted_policies.join("، ")));
  if ((r.endorsement_policies || []).length)
    ol.append(el("li", "endorse", `بیمه‌نامه ${r.endorsement_policies.join("، ")} هنوز جاری است؛ این تخفیف قابل انتقال است ولی برای انتقال نیاز به الحاقیه حذف تخفیفات دارد.`));
  wrap.append(ol);
  return wrap;
}

// ---------- جدول بیمه‌نامه‌های خودروی مبنا (با ردیف الحاقیه زیر هر بیمه‌نامه) ----------
function policiesTable(car) {
  const wrap = el("div", "panel");
  wrap.append(el("h2", "", "بیمه‌نامه‌های خودروی مبنا"));
  const tw = el("div", "table-wrap"), t = el("table", "policy-table");
  const head = el("tr");
  ["شرکت", "شماره بیمه‌نامه", "تاریخ شروع", "تاریخ پایان", "وضعیت", "تخفیف ثالث", "تخفیف راننده"]
    .forEach(h => head.append(el("th", "", h)));
  const thead = el("thead"); thead.append(head); t.append(thead);
  const tb = el("tbody");
  const counted = new Set(car.counted_policies || []);

  car.policies.forEach(p => {
    const tr = el("tr", "policy-row");
    const num = el("td", "num", p.number); if (counted.has(p.number)) num.classList.add("strong");
    const st = el("td"); st.append(el("span", "chip" + (p.expired ? " exp" : ""), p.expired ? "منقضی" : "معتبر"));
    tr.append(el("td", "", val(p.company)), num, el("td", "num", fmtDate(p.start)), el("td", "num", fmtDate(p.end)), st,
      el("td", "strong", p.endorsement ? "0" : val(p.discount_percent)),
      el("td", "strong", p.endorsement ? "0" : val(p.driver_discount_percent)));
    tb.append(tr);

    const sub = (cls, label, text) => {
      const r = el("tr", "sub-row " + cls), td = el("td"); td.colSpan = 7;
      td.append(el("span", "sub-label", label), document.createTextNode(text)); r.append(td); tb.append(r);
    };
    if (p.endorsement) sub("endorsement-row", "📄 الحاقیه:", "حذف تخفیفات — تخفیفات ۰" + (p.endorsement_text ? " — " + p.endorsement_text : ""));
    if (p.needs_print) sub("endorsement-row", "📄 نکته:", "بیمه ایران است؛ برای مشخص شدن حذف تخفیفات، چاپ الحاقیه بیمه‌نامه را دریافت کنید.");
    else if (!p.expired && !p.endorsement) sub("endorsement-row", "📄 نکته:", "بیمه‌نامه هنوز جاری است؛ تخفیف قابل انتقال است ولی نیاز به الحاقیه حذف تخفیفات دارد.");
  });
  t.append(tb); tw.append(t); wrap.append(tw);
  return wrap;
}

function show(data) {
  const out = $("out"); out.replaceChildren();
  const r = data.result;
  out.append(announceCard(r, data));

  if (data.warnings.length) {
    const w = el("div", "panel"); w.append(el("h2", "", "هشدارها"));
    data.warnings.forEach(t => w.append(el("div", "warn", t)));
    out.append(w);
  }

  // همه‌ی جزئیات: نحوه‌ی محاسبه، بیمه‌نامه‌های خودروی مبنا، جزئیات هر خودرو
  const body = el("div", "details-body");
  const logic = logicPanel(r); if (logic) body.append(logic);

  const best = r.cars.find(c => c.chassis === r.best_chassis);
  if (best && best.policies && best.policies.length) body.append(policiesTable(best));

  const cars = el("div", "panel"); cars.append(el("h2", "", "جزئیات هر خودرو"));
  r.cars.forEach(c => {
    const d = el("div", "car" + (c.chassis === r.best_chassis ? " best" : ""));
    d.append(el("div", "", `${c.percent}٪ — ${RULES[c.rule] || c.rule}`));
    const s = el("small", "", "شاسی: "); s.append(el("b", "ltr", c.chassis)); d.append(s);
    c.notes.forEach(n => d.append(el("small", "", n)));
    if (c.counted_policies.length) d.append(el("small", "", "بیمه‌نامه‌های شمرده‌شده: " + c.counted_policies.join("، ")));
    cars.append(d);
  });
  body.append(cars);

  const bar = el("div", "details-bar");
  const toggle = el("button", "details-toggle"); toggle.type = "button";
  const label = el("span", "", "نمایش جزئیات"), arrow = el("span", "arrow", "▾");
  toggle.append(label, arrow); toggle.setAttribute("aria-expanded", "false");
  toggle.onclick = () => {
    const open = body.classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
    label.textContent = open ? "بستن جزئیات" : "نمایش جزئیات";
  };
  bar.append(toggle);
  out.append(bar, body);
}

$("go").onclick = async () => {
  const btn = $("go"), out = $("out"), st = $("status");
  btn.disabled = true; btn.textContent = "در حال استعلام…"; out.replaceChildren();
  st.innerHTML = ""; st.append(el("div", "status loading", "در حال استعلام از بیمه مرکزی و بیمه ملت… (ممکن است چند ثانیه طول بکشد)"));
  try {
    const res = await fetch(API_BASE + "/api/analyze", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({national_code: $("nc").value, trace_code: $("tc").value,
        left2: $("l2").value, letter: $("lt").value, right3: $("r3").value, serial: $("sr").value})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "خطای نامشخص");
    st.replaceChildren();
    $("printTitle").textContent = `تاریخچه‌خوانی — پلاک: ${$("sr").value} - ${$("r3").value} ${$("lt").value} ${$("l2").value} — تاریخ چاپ: ${new Date().toLocaleDateString("fa-IR")}`;
    show(data);
  } catch (e) {
    const msg = e instanceof TypeError ? "اتصال به سرور محلی برقرار نشد؛ مطمئن شو python app.py اجراست" : e.message;
    st.replaceChildren(el("div", "status error", "خطا: " + msg));
    checkServer();
  } finally {
    btn.disabled = false; btn.textContent = "استعلام و محاسبه";
  }
};
checkServer();
</script>
</body>
